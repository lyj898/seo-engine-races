name: Daily review article

# Writes ONE long-form review article per day (scripts/generate-reviews.js)
# for a race that doesn't have one yet, then deploys. Same guard rails as the
# weekly refresh:
#
#   - `npm run validate` runs before and after. The post-run pass is the gate
#     that catches a schema-invalid, duplicate, or -- specifically for reviews
#     -- an unresolvable [n] citation, and fails the build rather than
#     shipping it. (generate-reviews.js also refuses to write such a draft, so
#     this is belt and braces.)
#   - The generator never overwrites an existing review on the scheduled/
#     auto-select path, so a hand-edited article is safe from every future
#     run -- unless this run is manually dispatched with `revise: true`,
#     which deliberately targets thin existing reviews and regenerates them
#     in place through this same validated pipeline (see generate-reviews.js's
#     --revise doc comment for why: hand-expanding stubs outside this
#     pipeline is what caused every content error this repo's Actions logs
#     caught on 2026-08-09).
#   - Like the weekly refresh, this commits with GITHUB_TOKEN, whose pushes
#     do NOT trigger deploy.yml's `on: push`. So deploying is an explicit
#     job that calls deploy.yml with `ref: main`, building the commit this
#     run just pushed rather than the stale SHA the run was triggered at.
on:
  schedule:
    # Self-healing cadence: GitHub's scheduled triggers are best-effort (often
    # delayed at the top of the hour, occasionally dropped), so instead of two
    # exact ticks a day we tick hourly and let the generator decide. It only
    # writes an article when it's been >= sourceConfig.reviewMinIntervalHours
    # (11h) since the last published review, so the result is a reliable ~2/day
    # even if several hourly ticks are delayed or skipped.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Comma-separated entity slugs to review (in order). Overrides auto-select.'
        required: false
        default: ''
      region:
        description: 'Restrict auto-select to this region id (e.g. indonesia). Used with limit.'
        required: false
        default: ''
      limit:
        description: 'Max reviews to write this run (auto mode). Blank = 1.'
        required: false
        default: ''
      revise:
        description: >-
          Regenerate thin existing reviews (<=2 sections, <=1 FAQ, or <=1
          source) instead of writing missing ones. Ignores the min-interval
          pacing gate; still respects slugs/region/limit above. See
          generate-reviews.js's --revise doc comment.
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-review
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate data (pre-flight)
        run: npm run validate

      - name: Generate review article(s)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUGS: ${{ github.event.inputs.slugs }}
          REGION: ${{ github.event.inputs.region }}
          LIMIT: ${{ github.event.inputs.limit }}
          REVISE: ${{ github.event.inputs.revise }}
        run: |
          ARGS=""
          [ -n "$SLUGS" ]  && ARGS="$ARGS --slugs $SLUGS"
          [ -n "$REGION" ] && ARGS="$ARGS --region $REGION"
          [ -n "$LIMIT" ]  && ARGS="$ARGS --limit $LIMIT"
          [ "$REVISE" = "true" ] && ARGS="$ARGS --revise"
          echo "npm run reviews -- $ARGS"
          npm run reviews -- $ARGS

      - name: Validate data (post-run)
        run: npm run validate
        # The gate: a review with an unresolvable citation, a duplicate slug,
        # or any schema violation fails here and nothing is committed.

      - name: Detect changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain data/reviews/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ADDED=$(git status --porcelain data/reviews/ | grep -c '^??' || true)
          REVISED=$(git status --porcelain data/reviews/ | grep -c '^ M' || true)
          if [ "$REVISED" != "0" ]; then
            MSG="chore(reviews): daily review article ($ADDED new, $REVISED revised)"
          else
            MSG="chore(reviews): daily review article ($ADDED new)"
          fi
          git add data/reviews/
          git commit -m "$MSG"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: No new review this run
        if: steps.diff.outputs.changed == 'false'
        run: echo "generate-reviews produced nothing to commit (e.g. every eligible race already has a review, or the draft was skipped)."

  # See deploy.yml / weekly-refresh.yml: a GITHUB_TOKEN push can't trigger the
  # deploy on its own, so we call it directly, building main's fresh tip.
  deploy:
    needs: review
    if: needs.review.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
    permissions:
      contents: read
      pages: write
      id-token: write
