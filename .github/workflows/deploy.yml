name: Deploy to GitHub Pages

# Builds the Astro site and publishes it to GitHub Pages.
#
# Three ways in:
#   push          - a human (or the web UI) pushing to main
#   workflow_dispatch - manual rebuild from the Actions tab, no commit needed
#   workflow_call - invoked as a job by another workflow
#
# workflow_call exists because of a GitHub rule that is easy to get caught
# by: a push made with the built-in GITHUB_TOKEN does NOT trigger further
# workflow runs. That guard prevents infinite loops, but it also meant
# weekly-refresh could commit new data to main and no deploy would ever
# fire -- the data sat on main, correct and invisible, until someone
# noticed. Calling this workflow as a job sidesteps the rule entirely,
# because it is no longer an *event* doing the triggering.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

# Allow one concurrent deployment; if a new push lands while a build is
# still running, cancel the in-progress one rather than queueing (we always
# want the latest commit live, not every intermediate one).
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # No package-lock.json is committed yet (this repo has never had
          # `npm install` run against a real registry -- see README's "Known
          # decisions" section), so there's nothing for actions/setup-node's
          # npm cache to key off. Once a lockfile exists, add
          # `cache: npm` back here for faster builds.

      - name: Install dependencies
        run: npm install

      - name: Build
        # Builds at the domain root -- public/CNAME points GitHub Pages at
        # runsea.run, so no base-path prefix is needed. (The temporary
        # PREVIEW_BASE_PATH override used before the domain cutover has been
        # removed, along with its branch in astro.config.mjs.)
        run: npm run build

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
