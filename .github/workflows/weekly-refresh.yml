name: Weekly data refresh

# Runs the discover -> refresh -> research -> summaries pipeline on a
# schedule (matching site.config.json's sourceConfig.refreshIntervalDays),
# plus supports a manual on-demand run from the Actions tab. (The listicle
# generation stage that used to run last was removed -- Best Of guides
# aren't being maintained for now.)
#
# This workflow commits straight to `main`, which deploys. That is a
# deliberate choice and the guard rails moved rather than disappeared:
#
#   - `npm run validate` runs both before and after the pipeline. A run that
#     ends in schema-invalid, duplicate or cross-reference-broken data fails
#     here and commits nothing at all.
#   - refresh-entities.js can only ever flag a listing `needs_review`; it has
#     no path to deleting or silently rewriting one, and only a genuinely
#     lapsed date auto-archives.
#   - Every run opens a GitHub issue naming exactly what was added, archived
#     and published. Review happens after the fact, on a readable summary,
#     instead of on a 200-file diff nobody would actually read.
#
# The thing to watch is that this trades "nothing goes live unreviewed" for
# "everything goes live and you get told about it". If a source site changes
# shape and starts yielding plausible-but-wrong data, it will be live for as
# long as it takes to read the notification.
on:
  schedule:
    # Anchored to Tuesday 14:00 Singapore time (SGT is UTC+8 year-round, no
    # DST observed) -- 06:00 UTC -- because that's when every weekend (and
    # Monday) race has fully lapsed, so refresh/archive logic has nothing
    # left dangling. GitHub's scheduled triggers are best-effort (delayed at
    # the top of the hour, occasionally dropped entirely), so we tick DAILY
    # at this same time and let the `gate` job decide: it runs the heavy
    # pipeline on Tuesday, and keeps retrying on every subsequent daily tick
    # if Tuesday's run didn't happen or didn't complete, until one succeeds
    # and records the marker. Net effect: lands on Tuesday almost always,
    # never silently skips a whole week if that one tick is dropped.
    - cron: '0 6 * * *' # daily 06:00 UTC (14:00 SGT); the gate decides whether to proceed
  workflow_dispatch: {} # manual runs always proceed (they bypass the gate)

concurrency:
  group: weekly-refresh
  cancel-in-progress: false # never cancel a run that's mid-way through writing data files

permissions:
  contents: write
  issues: write # the run summary is delivered as an issue (see below)

jobs:
  # Turns a daily tick into a Tuesday-anchored weekly cadence: a manual
  # dispatch always runs; a scheduled tick runs only if the recorded last
  # run (marker at .github/state/last-refresh) predates this week's Tuesday.
  # That means the normal case is "runs once, on Tuesday" -- but if
  # Tuesday's tick is dropped/delayed by GitHub, or the pipeline run itself
  # fails before reaching the "record run timestamp" step, the marker never
  # advances past last week, so Wednesday's (and Thursday's, etc.) daily
  # tick sees the same stale marker and retries -- until one run succeeds
  # and moves the marker into this week, at which point the rest of the
  # week's ticks skip.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Decide whether to run
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Manual dispatch -> running (gate bypassed)."; exit 0
          fi
          LAST=$(cat .github/state/last-refresh 2>/dev/null || echo "")
          # ISO weekday: 1=Mon .. 7=Sun, Tuesday=2. The cron fires at
          # 06:00 UTC (14:00 SGT), safely within the same calendar day in
          # both zones, so today's UTC weekday matches today's SGT weekday.
          TODAY_DOW=$(date -u +%u)
          DAYS_SINCE_TUE=$(( (TODAY_DOW - 2 + 7) % 7 ))
          THIS_WEEK_TUE=$(date -u -d "-${DAYS_SINCE_TUE} days" +%Y-%m-%d)
          if [ -z "$LAST" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "No marker -> running."; exit 0
          fi
          if [ "$LAST" \< "$THIS_WEEK_TUE" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Last successful run ($LAST) predates this week's Tuesday ($THIS_WEEK_TUE) -> running (Tuesday's tick was evidently missed or failed)."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Already refreshed this week (last=$LAST, this week's Tuesday=$THIS_WEEK_TUE) -> skipping this tick."
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      # Consumed by the deploy job below, so a run that changed nothing
      # doesn't spend a build.
      changed: ${{ steps.summary.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate data (pre-flight)
        run: npm run validate
        # If data/ is already broken before this run even starts, stop here
        # rather than layering AI-generated changes on top of a known-bad
        # state. Fix the underlying data and re-run manually.

      - name: Discover new entities
        run: npm run discover
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Refresh existing entities
        run: npm run refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Research entities on the web
        run: npm run research
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Gathers first-hand commentary (quotes, highlights, caveats,
        # sentiment) that the aggregator sources don't carry, so the summary
        # step below has something to write from beyond date/distance/venue.
        # Rate-limited by sourceConfig.researchPerRunLimit and only re-runs
        # an entity after researchIntervalDays, so weekly cost stays flat
        # rather than scaling with the size of the directory.

      - name: Generate AI summaries
        run: npm run summaries
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Create and refresh guides
        run: npm run listicles -- --refresh-stale
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Runs AFTER discover/refresh/summaries so it sees this week's
        # calendar, not last week's. The create pass adds guides for newly
        # eligible category x country combinations; --refresh-stale rewrites
        # the copy of existing guides whose race set has changed since that
        # copy was written -- without it a guide's prose was written once and
        # then described an increasingly historical directory forever (one
        # led with two races that had been run and archived weeks earlier).

      - name: Validate data (post-run)
        run: npm run validate
        # If any stage produced schema-invalid, duplicate or
        # cross-reference-broken data, fail here. This is the gate that
        # replaced the pull request: nothing is committed from a run that
        # ends in known-bad data -- you get a red X in Actions instead,
        # which is the correct failure mode.

      - name: Summarise what changed
        id: summary
        run: |
          HEADLINE=$(node scripts/summarize-changes.js --out refresh-summary.md)
          echo "headline=$HEADLINE" >> "$GITHUB_OUTPUT"
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          # How many discovery sources were unusable. Surfaced as its own
          # output because it has to be able to trigger a notification on its
          # own: a run where every source 403s changes no data, and gating the
          # issue on `changed` alone meant total source failure was reported
          # exactly like "nothing new to find" -- silence. That is how four
          # dead sources went unnoticed for weeks.
          # Counts only kind:'source' failures -- a site refusing to serve the
          # page. Extraction failures (our API call) are reported in the issue
          # body but must NOT trigger a notification on their own, or a
          # transient 429 would open an issue every run.
          FAILED=$(node -e "try{const r=require('./.pipeline-source-report.json');process.stdout.write(String((r.sources||[]).filter(s=>!s.ok&&s.kind!=='pipeline').length))}catch{process.stdout.write('0')}")
          echo "sources_failing=$FAILED" >> "$GITHUB_OUTPUT"
          echo "Discovery sources unreachable this run: $FAILED"
        # Must run BEFORE the commit: it diffs the working tree against HEAD
        # to work out which files are new and which changed status.

      - name: Commit and push to main
        if: steps.summary.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): ${{ steps.summary.outputs.headline }}"
          # Rebase rather than merge: a hand edit pushed to main while this
          # hour-long run was in flight should stay on top, not be clobbered
          # by a stale checkout.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Notify by email (via a GitHub issue)
        if: steps.summary.outputs.changed == 'true' || steps.summary.outputs.sources_failing != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # @-mention the owner in the body as well as assigning them. These are
          # two different GitHub notification categories ("Mentions" vs
          # "Participating"), emailed independently, and Mentions is the one
          # people most often have switched on -- so this is the cheapest way to
          # make delivery more likely without anyone changing their settings.
          printf '@%s\n\n' "${{ github.repository_owner }}" > issue-body.md
          cat refresh-summary.md >> issue-body.md
          gh issue create \
            --title "${{ steps.summary.outputs.headline }}" \
            --body-file issue-body.md \
            --label automated-refresh \
            --assignee "${{ github.repository_owner }}"
        # Delivered as an issue rather than SMTP on purpose: GitHub emails the
        # assignee automatically, so this needs no mail server, no app
        # password and no secret to rotate. The summary is also permanently
        # searchable in the repo, which a mailbox thread is not.
        #
        # WHICH ADDRESS IT REACHES is a property of the recipient's GitHub
        # account (Settings > Emails, plus Settings > Notifications), not of
        # anything in this repo -- there is no address to configure here. If
        # mail is not arriving, check those two pages first.

      - name: No changes this run
        if: steps.summary.outputs.changed == 'false'
        run: echo "Pipeline ran; nothing changed in data/, nothing committed."

      - name: Record run timestamp
        run: |
          mkdir -p .github/state
          date -u +%Y-%m-%d > .github/state/last-refresh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/state/last-refresh
          git diff --cached --quiet || git commit -m "chore(ci): record weekly-refresh run $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
        # Stamps today's date so the gate can enforce the ~weekly interval
        # across daily ticks. Kept OUT of data/ so it never trips the
        # data-changed deploy gate. No `if:`, so it runs only when every prior
        # stage succeeded -- a failed pipeline leaves the marker stale and is
        # retried on the next daily tick rather than being suppressed for a week.

  # Deploying has to be an explicit job rather than something we leave to
  # deploy.yml's `on: push`. The commit above is made with GITHUB_TOKEN, and
  # GitHub deliberately does not let token-authored pushes trigger workflows
  # -- so the push event never fires and the site would silently keep serving
  # the previous build. Calling the workflow directly is not an event, so the
  # restriction doesn't apply.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      # Build the commit the refresh job just pushed, NOT the SHA this run was
      # triggered at. Without this the deploy checks out github.sha (the tip of
      # main *before* the refresh committed), so the site publishes successfully
      # but one commit stale -- the pipeline's whole point silently lost.
      ref: main
    permissions:
      contents: read
      pages: write
      id-token: write
